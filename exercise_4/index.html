<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <title>CSS Letterform Demo</title>
    <style>
      * {
        box-sizing: border-box;
      }
      .parent {
        border: transparent;
        width: 200px;
        height: 200px;
      }
      .child {
        height: 20px;
        background-color: rgb(134, 6, 34);
        margin-bottom: 70px;
      }
      .vertical {
        position: absolute;
        background-color: rgb(134, 6, 34);
        width: 20px;
        height: 200px;
      }
      .child:nth-child(1) {
        margin-bottom: 10;
      }
      .dot-child{
        height: 100px;
        width: 200px;
        background-color: rgb(14, 14, 82);
        border-radius: 50%;
        margin-bottom:50px;
        margin-left:200px;
      }
      .parent-dot {
        border: transparent;
        align-items:center;
        width: 500px;
        height: 500px;
        display: flex;
    flex-direction: column;
    align-items:center;
    text-align: center;
      }
      .vertical-dot {
        position:absolute;
        background-color:rgb(14, 14, 82);
        height: 400px;
        width:100px;
        border-radius:50%;
      }
      .dot:nth-child(1) {
        margin-bottom: 10;
      }
      .triangle-up {
	width: 0;
	height: 0;
	border-left: 25px solid transparent;
	border-right: 25px solid transparent;
	border-bottom: 50px solid #023e23;
}
.triangle-right {
	width: 0;
	height: 0;
	border-top: 25px solid transparent;
	border-left: 50px solid rgb(40, 142, 84);
	border-bottom: 25px solid transparent;
}
.parent-two{
border: transparent;
        width: 1000px;
        height: 1000px;
}
.child-vertical-two{
    position: absolute;
        background-color: rgb(232, 138, 32);
        width: 80px;
        height: 200px;
}
.child-two{
    height: 100px;
        background-color: rgb(134, 6, 132);
        margin-bottom: 10px;
        margin-left: 90px;
}
.child-three{
    height: 10px;
        background-color: rgb(6, 127, 134);
        margin-bottom: 10px;
        margin-left: 0px;
}
.child-fourth{
    height: 70px;
        background-color: rgb(8, 134, 6);
        margin-bottom: 10px;
        margin-left: 0px;
}
.parallelogram {
	width: 100px;
	height: 50px;
	transform: skew(45deg);
	background: #16dcbe;
    margin-top:10px;
}
    </style>

  </head>
  <body>
    <div class="parent">    
      <div class="child vertical"></div>
      <div class="child"></div>
      <div class="child"></div>
      <div class="child"></div>
    </div>
    <div class="parent-dot">    
      <div class="vertical-dot"></div>
      <div class="dot-child"></div>
      <div class="dot-child"></div>
      <div class="dot-child"></div>
      </div>
<div class="triangle-right"></div>
<div class="triangle-right"></div>
<div class="triangle-right"></div>
      <div class="parent">
      <div class="child-vertical-two"></div>
      <div class="child-two"></div>
       <div class="child-three"></div>
       <div class="child-fourth"></div>
    </div>
<div class="parallelogram"></div>
<div class="parallelogram"></div>
<div class="parallelogram"></div>
  </body>
</html>
